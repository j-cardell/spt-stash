<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPT Stash — V1 Compact Sidebar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #111318;
    --surface: #171a21;
    --surface2: #1e222b;
    --border: #242935;
    --text: #e4e7ec;
    --text-muted: #8a92a2;
    --accent: #6c8cff;
    --accent-hover: #7d9bff;
    --success: #4ade80;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 8px;
    --sidebar-w: 220px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    height: 100vh; display: flex; overflow: hidden; font-size: 13px;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .brand { padding: 18px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  .brand-icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), #a855f7); border-radius: 8px; display:flex; align-items:center; justify-content:center; font-weight: 700; color: #fff; font-size: 12px; }
  .brand-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
  .nav { flex: 1; padding: 10px 8px; }
  .nav-section { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 12px 8px 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; margin-bottom: 1px; }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-item.active { color: var(--text); background: var(--surface2); }
  .nav-item.active::before { content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); width: 2px; height: 16px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .nav-item { position: relative; }
  .nav-icon { width: 16px; height: 16px; opacity: 0.7; }
  .nav-item.active .nav-icon { opacity: 1; color: var(--accent); }
  .server-block { padding: 12px; border-top: 1px solid var(--border); }
  .server-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .status-dot.running { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .server-actions { display: flex; gap: 6px; }

  /* Buttons */
  .btn { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: #252a36; border-color: #2e3444; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-success { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.25); color: var(--success); }
  .btn-success:hover { background: rgba(74,222,128,0.2); }
  .btn-danger { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.25); color: var(--danger); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-icon { padding: 7px 9px; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); }
  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .topbar-sub { color: var(--text-muted); font-size: 12px; margin-top: 1px; }
  .toolbar { padding: 12px 20px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg); }
  .search { flex: 1; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; color: var(--text); font-size: 13px; outline: none; transition: border-color 0.15s; }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text-muted); }

  /* Content */
  .content { flex: 1; overflow: auto; padding: 0; }
  .mod-list { }
  .mod-header { display: grid; grid-template-columns: 34px 1fr 90px 110px 130px 90px 160px; gap: 12px; padding: 10px 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); }
  .mod-row { display: grid; grid-template-columns: 34px 1fr 90px 110px 130px 90px 160px; gap: 12px; padding: 11px 20px; border-bottom: 1px solid var(--border); align-items: center; transition: background 0.12s; }
  .mod-row:hover { background: var(--surface); }
  .mod-check { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .mod-name { font-weight: 500; font-size: 13px; }
  .mod-type { color: var(--text-muted); font-size: 12px; }
  .mod-version { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .mod-author { color: var(--text-muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 99px; }
  .pill-success { background: rgba(74,222,128,0.1); color: var(--success); }
  .pill-muted { background: rgba(138,146,162,0.1); color: var(--text-muted); }
  .pill-warn { background: rgba(251,191,36,0.1); color: var(--warning); }
  .mod-actions { display: flex; gap: 6px; justify-content: flex-end; }

  /* Bottom bar */
  .bulk-bar { padding: 11px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); font-size: 12px; color: var(--text-muted); }
  .bulk-actions { display: flex; gap: 6px; }

  /* Settings button */
  .icon-btn { width: 30px; height: 30px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .icon-btn:hover { color: var(--text); background: var(--surface2); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-icon">S</div>
    <div class="brand-name">SPT Stash</div>
  </div>
  <nav class="nav">
    <div class="nav-section">Library</div>
    <div class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      Installed Mods
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      Presets
    </div>
    <div class="nav-section">Discover</div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Browse Forge
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Install Archive
    </div>
    <div class="nav-section">System</div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Performance
    </div>
  </nav>
  <div class="server-block">
    <div class="server-status">
      <span class="status-dot"></span>
      Server: Stopped
    </div>
    <div class="server-actions">
      <button class="btn btn-success btn-sm" style="flex:1">Start</button>
      <button class="btn btn-primary btn-sm" style="flex:1.4">Launch Game</button>
      <button class="icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title">Installed Mods</div>
      <div class="topbar-sub">67 packages · 79 component files</div>
    </div>
  </div>

  <div class="toolbar">
    <input class="search" placeholder="Filter mods...">
    <button class="btn btn-sm">Check Updates</button>
    <button class="btn btn-sm">Audit Dependencies</button>
    <div style="flex:1"></div>
    <button class="btn btn-sm">Export</button>
    <button class="btn btn-sm">Import</button>
    <button class="btn btn-sm">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>

  <div class="content">
    <div class="mod-header">
      <div></div><div>Mod</div><div>Version</div><div>Type</div><div>Fika Status</div><div>Author</div><div></div>
    </div>
    <div class="mod-list" id="modList"></div>
  </div>

  <div class="bulk-bar">
    <div><span id="selCount">0</span> of 67 selected</div>
    <div class="bulk-actions">
      <button class="btn btn-sm" onclick="toggleAll(true)">Select All</button>
      <button class="btn btn-sm" onclick="toggleAll(false)">Deselect All</button>
      <button class="btn btn-sm btn-success">Enable Selected</button>
      <button class="btn btn-sm">Disable Selected</button>
      <button class="btn btn-sm btn-danger">Delete Selected</button>
    </div>
  </div>
</main>

<script>
const mods = [
  {name:"Adaptive Bot Culling", version:"v1.2.0", type:"Client (BepInEx)", fika:"unknown", author:"Hysocs", enabled:true},
  {name:"Amands' Sense - Updated", version:"v3.1.0", type:"Client (BepInEx)", fika:"unknown", author:"DrakiaXYZ", enabled:true},
  {name:"Amands's Graphics", version:"v1.8.0", type:"Client (BepInEx)", fika:"compatible", author:"Amands2Mello", enabled:true},
  {name:"Armbands For All", version:"v1.1.0", type:"Client (BepInEx)", fika:"unknown", author:"acidphantasm", enabled:true},
  {name:"Armor Class Icon", version:"v1.1.1", type:"Client (BepInEx)", fika:"unknown", author:"xvotex", enabled:true},
  {name:"ASBP - Acid's Scalable BepInEx Panel", version:"v1.0.0", type:"Client (BepInEx)", fika:"compatible", author:"acidphantasm", enabled:true},
  {name:"Auto Ranging", version:"v2.0.0", type:"Client (BepInEx)", fika:"unknown", author:"Vultify", enabled:true},
  {name:"AutoCorpseSearch", version:"v2.0.0", type:"Client (BepInEx)", fika:"unknown", author:"Hysocs", enabled:true},
  {name:"AutoDeposit", version:"v6.0.0", type:"Client (BepInEx)", fika:"compatible", author:"Tyfon", enabled:true},
  {name:"BALL - Better Ammo Loading List", version:"v1.1.1", type:"Client (BepInEx)", fika:"compatible", author:"Katrin0522", enabled:true},
  {name:"Better Keys NG", version:"v1.8.0", type:"Server (user/mods)", fika:"compatible", author:"flip", enabled:true},
  {name:"BigBrain", version:"v1.5.0", type:"Client (BepInEx)", fika:"unknown", author:"DrakiaXYZ", enabled:false},
  {name:"Borkel's Realistic NVGs", version:"v2.0.1", type:"Dual (Client+Server)", fika:"compatible", author:"Borkel", enabled:true},
  {name:"Corpse Clean Up", version:"v1.4.0", type:"Client (BepInEx)", fika:"compatible", author:"Hysocs", enabled:true},
  {name:"Custom Raid Times", version:"v2.3.0", type:"Server (user/mods)", fika:"unknown", author:"acidphantasm", enabled:true},
];

const list = document.getElementById('modList');
mods.forEach((m,i)=>{
  const pill = m.fika==='compatible'
    ? '<span class="pill pill-success">Compatible</span>'
    : m.fika==='incompatible'
    ? '<span class="pill pill-warn">Issues</span>'
    : '<span class="pill pill-muted">Unknown</span>';
  const toggleBtn = m.enabled
    ? '<button class="btn btn-sm btn-danger" onclick="toggleMod(this)">Disable</button>'
    : '<button class="btn btn-sm btn-success" onclick="toggleMod(this)">Enable</button>';
  list.innerHTML += `
    <div class="mod-row">
      <div><input type="checkbox" class="mod-check" onchange="updateCount()"></div>
      <div><div class="mod-name">${m.name}</div></div>
      <div class="mod-version">${m.version}</div>
      <div class="mod-type">${m.type}</div>
      <div>${pill}</div>
      <div class="mod-author">${m.author}</div>
      <div class="mod-actions">${toggleBtn}<button class="btn btn-sm btn-danger">Delete</button></div>
    </div>`;
});

function toggleMod(btn){
  if(btn.textContent==='Disable'){ btn.textContent='Enable'; btn.className='btn btn-sm btn-success'; }
  else { btn.textContent='Disable'; btn.className='btn btn-sm btn-danger'; }
}
function toggleAll(on){
  document.querySelectorAll('.mod-check').forEach(c=>c.checked=on); updateCount();
}
function updateCount(){
  const n = document.querySelectorAll('.mod-check:checked').length;
  document.getElementById('selCount').textContent = n;
}
updateCount();
</script>
</body>
</html>
