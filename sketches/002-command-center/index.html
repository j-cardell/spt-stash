<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPT Stash — V2 Command Center</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0e12;
    --surface: #14161d;
    --surface2: #1b1e28;
    --surface3: #222634;
    --border: #232736;
    --border-light: #2d3247;
    --text: #eceef3;
    --text-muted: #7f8698;
    --accent: #5b8cff;
    --success: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden; font-size: 13.5px;
  }

  /* Big top bar */
  .top {
    padding: 16px 24px; background: linear-gradient(to bottom, var(--surface), var(--bg));
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 20px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), #a855f7); border-radius: 10px; display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 15px; color:#fff; }
  .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .brand-tag { font-size: 10.5px; color: var(--text-muted); }

  .server-card { display: flex; align-items: center; gap: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; margin-left: auto; }
  .server-status { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .server-actions { display: flex; gap: 8px; }

  .btn { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface3); color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: #292e3f; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4d7df0; }
  .btn-success { background: rgba(52,211,153,0.15); border-color: transparent; color: var(--success); }
  .btn-lg { padding: 10px 20px; font-size: 13px; }
  .btn-icon { padding: 9px 10px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .tab { padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-badge { background: var(--surface3); color: var(--text-muted); font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 7px; }
  .tab.active .tab-badge { background: rgba(91,140,255,0.15); color: var(--accent); }

  /* Toolbar */
  .toolbar { padding: 14px 24px; display: flex; gap: 10px; align-items: center; }
  .search { flex: 1; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; color: var(--text); font-size: 13px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--text-muted); }
  .chip { padding: 7px 13px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--border-light); }

  /* Card grid */
  .content { flex: 1; overflow: auto; padding: 8px 24px 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: border-color 0.15s, background 0.15s; cursor: default; position: relative; }
  .card:hover { border-color: var(--border-light); background: var(--surface2); }
  .card.disabled { opacity: 0.55; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .card-check { accent-color: var(--accent); width: 15px; height: 15px; margin-top: 2px; cursor: pointer; }
  .card-body { flex: 1; min-width: 0; }
  .card-name { font-weight: 650; font-size: 13.5px; letter-spacing: -0.005em; margin-bottom: 3px; }
  .card-meta { color: var(--text-muted); font-size: 11.5px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card-meta .sep { opacity: 0.3; }
  .card-badges { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 5px; }
  .badge-type { background: var(--surface3); color: var(--text-muted); }
  .badge-success { background: rgba(52,211,153,0.12); color: var(--success); }
  .badge-muted { background: rgba(127,134,152,0.12); color: var(--text-muted); }
  .card-actions { display: flex; gap: 5px; }
  .mini-btn { padding: 5px 9px; border-radius: 6px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 11px; font-weight: 500; cursor: pointer; }
  .mini-btn:hover { color: var(--text); background: var(--surface3); }
  .mini-btn.danger:hover { color: var(--danger); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }
  .mini-btn.success:hover { color: var(--success); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.08); }

  /* Status bar */
  .statusbar { padding: 8px 24px; border-top: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 18px; font-size: 11.5px; color: var(--text-muted); }
  .status-item { display: flex; align-items: center; gap: 6px; }
  .status-item strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <div class="brand-icon">S</div>
    <div>
      <div class="brand-name">SPT Stash</div>
      <div class="brand-tag">Mod Manager for Single-Player Tarkov</div>
    </div>
  </div>
  <div class="server-card">
    <div class="server-status"><span class="dot"></span> Server Stopped</div>
    <div class="server-actions">
      <button class="btn btn-success">Start Server</button>
      <button class="btn btn-primary btn-lg">▶ Launch SPT</button>
      <button class="btn btn-icon">⚙</button>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active">Installed Mods<span class="tab-badge">67</span></div>
  <div class="tab">Presets<span class="tab-badge">4</span></div>
  <div class="tab">Browse Forge</div>
  <div class="tab">Install Archive</div>
  <div class="tab">Performance</div>
</div>

<div class="toolbar">
  <input class="search" placeholder="Search installed mods...">
  <button class="chip">Check Updates</button>
  <button class="chip">Audit Dependencies</button>
  <button class="chip">Refresh</button>
  <div style="flex:1"></div>
  <button class="btn">Export Manifest</button>
  <button class="btn">Import</button>
</div>

<div class="content">
  <div class="grid" id="grid"></div>
</div>

<div class="statusbar">
  <div class="status-item"><strong>67</strong> packages installed</div>
  <div class="status-item"><strong>79</strong> component files</div>
  <div class="status-item"><strong>66</strong> enabled</div>
  <div class="status-item"><strong>2</strong> updates available</div>
  <div style="flex:1"></div>
  <div class="status-item">SPT 4.1.3 · <span id="sel">0</span> selected</div>
</div>

<script>
const mods = [
  {name:"Adaptive Bot Culling", version:"v1.2.0", type:"Client", fika:"unknown", author:"Hysocs", enabled:true},
  {name:"Amands' Sense - Updated", version:"v3.1.0", type:"Client", fika:"unknown", author:"DrakiaXYZ", enabled:true},
  {name:"Amands's Graphics", version:"v1.8.0", type:"Client", fika:"compatible", author:"Amands2Mello", enabled:true},
  {name:"Armbands For All", version:"v1.1.0", type:"Client", fika:"unknown", author:"acidphantasm", enabled:true},
  {name:"Armor Class Icon", version:"v1.1.1", type:"Client", fika:"unknown", author:"xvotex", enabled:true},
  {name:"ASBP - Acid's Scalable BepInEx Panel", version:"v1.0.0", type:"Client", fika:"compatible", author:"acidphantasm", enabled:true},
  {name:"Auto Ranging", version:"v2.0.0", type:"Client", fika:"unknown", author:"Vultify", enabled:true},
  {name:"AutoCorpseSearch", version:"v2.0.0", type:"Client", fika:"unknown", author:"Hysocs", enabled:true},
  {name:"AutoDeposit", version:"v6.0.0", type:"Client", fika:"compatible", author:"Tyfon", enabled:true},
  {name:"BALL - Better Ammo Loading List", version:"v1.1.1", type:"Client", fika:"compatible", author:"Katrin0522", enabled:true},
  {name:"Better Keys NG", version:"v1.8.0", type:"Server", fika:"compatible", author:"flip", enabled:true},
  {name:"BigBrain", version:"v1.5.0", type:"Client", fika:"unknown", author:"DrakiaXYZ", enabled:false},
  {name:"Borkel's Realistic NVGs", version:"v2.0.1", type:"Dual", fika:"compatible", author:"Borkel", enabled:true},
  {name:"Corpse Clean Up", version:"v1.4.0", type:"Client", fika:"compatible", author:"Hysocs", enabled:true},
  {name:"Custom Raid Times", version:"v2.3.0", type:"Server", fika:"unknown", author:"acidphantasm", enabled:true},
];
const grid = document.getElementById('grid');
mods.forEach(m=>{
  const fika = m.fika==='compatible'
    ? '<span class="badge badge-success">Fika ✓</span>'
    : '<span class="badge badge-muted">Fika ?</span>';
  grid.innerHTML += `
    <div class="card ${m.enabled?'':'disabled'}">
      <div class="card-top">
        <input type="checkbox" class="card-check" onchange="upd()">
        <div class="card-body">
          <div class="card-name">${m.name}</div>
          <div class="card-meta">${m.version}<span class="sep">·</span>${m.author}</div>
          <div class="card-badges">
            <span class="badge badge-type">${m.type}</span>
            ${fika}
          </div>
        </div>
        <div class="card-actions">
          <button class="mini-btn ${m.enabled?'danger':'success'}">${m.enabled?'Disable':'Enable'}</button>
          <button class="mini-btn danger">✕</button>
        </div>
      </div>
    </div>`;
});
function upd(){
  document.getElementById('sel').textContent = document.querySelectorAll('.card-check:checked').length;
}
upd();
</script>
</body>
</html>
