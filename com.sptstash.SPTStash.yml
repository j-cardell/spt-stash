app-id: com.sptstash.SPTStash
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: spt_mod_manager.py
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=host

modules:
  - name: python3-pyside6
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} PySide6
  - name: spt-stash
    buildsystem: simple
    build-commands:
      - install -D spt_mod_manager.py ${FLATPAK_DEST}/bin/spt_mod_manager.py
      - cp -r spt_stash ${FLATPAK_DEST}/bin/
      - cp -r docs ${FLATPAK_DEST}/bin/
      - chmod +x ${FLATPAK_DEST}/bin/spt_mod_manager.py
    sources:
      - type: dir
        path: .
