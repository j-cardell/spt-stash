name: SPT Stash CI & Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Run Linter & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install System & Qt Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6

      - name: Run AST Linting & Unit Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python run_tests.py

  security-audit:
    name: Code & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Security Scanners (Bandit & Pip-Audit)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install bandit pip-audit PySide6

      - name: Run Bandit Code Security Scan
        run: |
          # Scans Python code for security issues (subprocess, injection, permissions)
          bandit -r spt_mod_manager.py -ll -ii -s B310,B404,B603,B607

      - name: Run Dependency Vulnerability Scan (Pip-Audit)
        run: |
          # Audits Python dependencies against the Python Packaging Advisory Database
          pip-audit || true
